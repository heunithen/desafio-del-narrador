<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>El desafío del narrador</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202c34;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:24px 16px 64px}header{margin:18px 0 28px}h1{font-size:clamp(1.8rem,5vw,2.7rem);margin:4px 0}h2{font-size:1.18rem;margin:0 0 16px}p{line-height:1.55}.muted{color:#66747c}.eyebrow{font-size:.77rem;font-weight:750;letter-spacing:.13em;color:#55788c;text-transform:uppercase}.panel{background:#fff;border:1px solid #e0e6e7;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #24343d08}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{border:1px solid #e0e6e7;border-radius:12px;padding:14px;min-width:0}.tile-top{display:flex;justify-content:space-between;align-items:center;gap:6px}.tile label{font-size:.77rem;color:#63727b;font-weight:650}.number{font-weight:800;font-size:1.45rem;color:#42677e}.value{margin:10px 0 8px;font-weight:650;min-height:43px}.smallbutton{border:1px solid #d5dfe2;background:#fff;color:#42677e;padding:7px 9px;border-radius:8px;cursor:pointer}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{font:inherit;cursor:pointer}button.primary{background:#496d82;border:1px solid #496d82;color:#fff;border-radius:10px;padding:12px 20px;font-weight:700}button.secondary{background:white;border:1px solid #cbd7db;color:#344f5d;border-radius:10px;padding:12px 18px;font-weight:650}button:hover{filter:brightness(.96)}button:disabled{opacity:.45;cursor:not-allowed}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#eaf1f3;color:#36596d;border-radius:30px;padding:7px 12px;font-size:.88rem;font-weight:650}.premise{font-size:clamp(1.08rem,3vw,1.4rem);line-height:1.55;font-weight:650;margin:16px 0 4px}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field p{font-size:.87rem;color:#66747c;margin:0 0 8px}textarea,input{width:100%;font:inherit;border:1px solid #cbd6da;border-radius:10px;padding:12px;background:white;color:#202c34}textarea{min-height:110px;resize:vertical}input{max-width:430px}.status{font-size:.9rem;color:#536b79;margin-top:10px}.archive{display:grid;gap:12px}.entry{border:1px solid #e0e6e7;border-radius:12px;padding:15px}.entry h3{margin:7px 0}.entry p{margin:8px 0;white-space:pre-wrap}.entry .meta{font-size:.8rem;color:#66747c}details{margin-top:16px}summary{cursor:pointer;font-weight:700}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.84rem}th,td{border-bottom:1px solid #e7edef;padding:8px;text-align:left;vertical-align:top}th{color:#47697a}footer{color:#78858c;font-size:.8rem;text-align:center;margin-top:30px}@media(max-width:620px){main{padding:16px 12px 40px}.panel{padding:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{padding:11px}.value{font-size:.88rem;min-height:54px}.buttons button{flex:1}}
</style></head><body><main><header><div class="eyebrow">Minijuego de creatividad para juegos de rol</div><h1>El desafío del narrador</h1><p class="muted">Lanza 6d20 y descubre una premisa para tu próxima aventura.</p></header><section class="panel"><h2>1. Genera tu desafío</h2><div id="dice" class="grid"></div><div class="buttons"><button class="primary" id="roll">⚄ Lanzar 6d20</button><button class="secondary" id="copy">Copiar premisa</button></div></section><section class="panel"><div class="eyebrow">Tu desafío</div><div class="chips" id="chips"></div><p class="premise" id="premise" aria-live="polite"></p><div id="status" class="status" role="status" aria-live="polite"></div></section></main><script>const names=['Género','Tono','Amenaza','Acción','Objetivo','Complicación'];
const tables=[
['Fantasía medieval','Ciencia ficción','Western','Policial','Fantasía oscura','Superhéroes','Cyberpunk','Postapocalíptico','Piratas','Terror sobrenatural','Espada y brujería','Fantasía urbana','Espionaje','Steampunk','Terror cósmico','Aventura pulp','Distopía','Mitológico','Supervivencia','Space opera'],
['Épico','Terrorífico','Humorístico','Misterioso','Trágico','Absurdo','Melancólico','Desesperado','Aventurero','Paranoico','Violento','Romántico','Intrigante','Satírico','Opresivo','Ligero','Rebelde','Solemne','Inquietante','Esperanzador'],
['Una sociedad secreta','Un antiguo enemigo','Una criatura desconocida','Un gobernante corrupto','Un culto religioso','Un científico brillante','Un ejército invasor','Un criminal legendario','Una inteligencia artificial','Un espíritu vengativo','Una corporación poderosa','Un viajero misterioso','Una organización rebelde','Un héroe desaparecido','Una entidad ancestral','Un grupo de mercenarios','Una familia influyente','Un impostor','Una comunidad aislada','Una persona aparentemente insignificante'],
['quiere destruir','intenta robar','busca controlar','pretende liberar','intenta transformar','planea conquistar','necesita encontrar','quiere despertar','intenta sustituir','busca corromper','pretende ocultar','intenta recuperar','planea sacrificar','quiere proteger','busca devorar','pretende secuestrar','intenta manipular','busca resucitar','planea revelar','quiere intercambiar'],
['una ciudad entera','un artefacto legendario','una comunidad aislada','una fuerza prohibida','a toda la población','un territorio olvidado','un secreto ancestral','una criatura dormida','el último ejemplar de algo','un lugar sagrado','una tecnología experimental','una persona importante','una fuente de poder','un documento comprometedor','una antigua prisión','un grupo de refugiados','una puerta hacia otro mundo','un recuerdo perdido','una organización rival','el destino de una nación'],
['antes del amanecer','durante una celebración','sin saber que es una trampa','con ayuda de un traidor','por una razón aparentemente noble','mientras ocurre una catástrofe','antes de que llegue una autoridad','utilizando una identidad falsa','a cambio de una vida inocente','sin que nadie pueda recordarlo','durante una guerra','porque alguien se lo ha ordenado','con consecuencias imprevisibles','mientras todos buscan a otro culpable','sin conocer su verdadera naturaleza','para impedir algo mucho peor','antes de que se cumpla una profecía','aunque eso implique su propia destrucción','con la colaboración involuntaria de los héroes','porque el tiempo está retrocediendo']];
let rolls=[1,7,1,1,5,9];const el=id=>document.getElementById(id);const getPremise=()=>`${tables[2][rolls[2]]} ${tables[3][rolls[3]]} ${tables[4][rolls[4]]}, ${tables[5][rolls[5]]}.`;function render(){el('dice').replaceChildren();names.forEach((name,i)=>{let tile=document.createElement('div');tile.className='tile';let top=document.createElement('div');top.className='tile-top';let label=document.createElement('label');label.textContent=name;let n=document.createElement('span');n.className='number';n.textContent=rolls[i]+1;top.append(label,n);let val=document.createElement('div');val.className='value';val.textContent=tables[i][rolls[i]];tile.append(top,val);el('dice').append(tile)});el('chips').replaceChildren();for(let i=0;i<2;i++){let chip=document.createElement('span');chip.className='chip';chip.textContent=names[i]+': '+tables[i][rolls[i]];el('chips').append(chip)}el('premise').textContent=getPremise();el('status').textContent=''}function random(){rolls=rolls.map(()=>Math.floor(Math.random()*20));render()}async function copy(){const text=`Género: ${tables[0][rolls[0]]}\nTono: ${tables[1][rolls[1]]}\nPremisa: ${getPremise()}`;try{await navigator.clipboard.writeText(text);el('status').textContent='Premisa copiada.'}catch(e){const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();el('status').textContent=ok?'Premisa copiada.':'No se pudo copiar automáticamente.'}}el('roll').onclick=random;el('copy').onclick=copy;render();</script></body></html>
